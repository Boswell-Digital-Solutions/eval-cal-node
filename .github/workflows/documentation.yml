name: Documentation

# Runs on documentation changes only. A change to code runs the code CI.
# A change to documentation runs this workflow and no code CI.
# See doc/system/50-operations.md ("Which CI runs for which change").

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'doc/**'
      - '**/*.md'
      - '.github/workflows/documentation.yml'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'doc/**'
      - '**/*.md'
      - '.github/workflows/documentation.yml'

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation (system build and snapshots)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds doc/ECNSYSTEM.md from doc/system/ and validates the snapshots.
      - name: Build the system reference
        run: bash doc/system/BUILD.sh

      - name: Check the assembled reference is committed
        run: git diff --exit-code -- doc
